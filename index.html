<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIS to Data Analyst Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI',sans-serif;}
body{background:#0f172a;color:#fff;padding:15px;padding-bottom:80px;}
.header{text-align:center;padding:20px 0;}
.header h1{font-size:22px;color:#38bdf8;}
.header p{color:#94a3b8;font-size:13px;margin-top:5px;}
.progress-card{background:#1e293b;border-radius:16px;padding:20px;margin:15px 0;border:1px solid #334155;}
.progress-top{display:flex;justify-content:space-between;align-items:center;}
.progress-circle{width:70px;height:70px;border-radius:50%;background:conic-gradient(#38bdf8 var(--p), #334155 0);display:flex;align-items:center;justify-content:center;}
.progress-inner{width:58px;height:58px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;}
.level{background:#1e293b;border-radius:12px;margin:12px 0;overflow:hidden;border:1px solid #334155;}
.level-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.level-head:active{background:#263449;}
.level-title{font-weight:600;font-size:14px;}
.level-badge{font-size:12px;background:#334155;padding:4px 10px;border-radius:20px;}
.tasks{display:none;padding:0 10px 10px 10px;}
.tasks.open{display:block;}
.task{display:flex;align-items:center;padding:12px 10px;background:#0f172a;margin:6px 0;border-radius:10px;cursor:pointer;border:1px solid transparent;user-select:none;-webkit-user-select:none;}
.task:active{border-color:#38bdf8;background:#1a253a;}
.task.done{background:#052e1f;border-color:#10b981;}
.task.done .task-text{text-decoration:line-through;color:#6ee7b7;}
.check{width:24px;height:24px;border:2px solid #475569;border-radius:6px;display:flex;align-items:center;justify-content:center;margin-right:12px;flex-shrink:0;transition:0.2s;}
.task.done .check{background:#10b981;border-color:#10b981;color:#fff;}
.task-text{font-size:13.5px;line-height:1.3;flex:1;}
.star{color:#fbbf24;margin-left:4px;}
</style>
</head>
<body>
<div class="header">
<h1>MIS → DATA ANALYST</h1>
<p>Kumesh • 90 Days Roadmap • Tirupur</p>
</div>

<div class="progress-card">
<div class="progress-top">
<div>
<div style="font-size:13px;color:#94a3b8;">OVERALL PROGRESS</div>
<div style="font-size:22px;font-weight:bold;margin-top:4px;" id="overallText">0% Mudichachu</div>
</div>
<div class="progress-circle" id="circle" style="--p:0deg;">
<div class="progress-inner" id="percent">0%</div>
</div>
</div>
</div>

<div id="container"></div>

<script>
const data = [
{ id:"1A", title:"🟢 EXCEL BASIC", color:"#22c55e", items:["Excel Interface / Workbook","Rows & Columns","Cells & References","Data Entry","Copy/Paste/Fill Handle","Formatting","Number/Currency/%/Date","Sort","Filter","Find & Replace","Freeze Panes","Basic Tables","Basic Charts","SUM","AVERAGE","MIN/MAX","COUNT/COUNTA","ROUND","Percentage calc","Relative vs Absolute Ref"]},
{ id:"1B", title:"🟡 EXCEL STRONG - MOST IMPORTANT", color:"#eab308", items:["IF","AND / OR","IF+AND / IF+OR","IFERROR","SUMIF / SUMIFS ⭐","COUNTIF / COUNTIFS ⭐","AVERAGEIF","VLOOKUP","XLOOKUP ⭐⭐","INDEX","MATCH","INDEX+MATCH ⭐⭐⭐","LEFT / RIGHT / MID","LEN / TRIM","UPPER / LOWER","CONCAT / TEXTJOIN","TODAY / NOW","DAY/MONTH/YEAR","DATEDIF / EOMONTH","Remove Duplicates","Text to Columns","Flash Fill"]},
{ id:"1C", title:"🔵 EXCEL ADVANCED", color:"#3b82f6", items:["Pivot Table ⭐⭐⭐","Pivot Chart ⭐⭐⭐","Slicers","Timelines","Grouping in Pivot","Calculated Fields","Conditional Formatting ⭐⭐","Data Validation ⭐⭐","Drop-down Lists","Named Ranges","UNIQUE / FILTER","SORT / SORTBY","SEQUENCE","Dynamic Arrays","Excel Tables","Power Query Import","Power Query Merge/Append","KPI Cards","Interactive Dashboard"]},
{ id:"2", title:"🔴 SQL", color:"#ef4444", items:["Database / Table / PK","SELECT / WHERE / DISTINCT","ORDER BY / LIMIT","AND/OR / IN / BETWEEN","LIKE / IS NULL","COUNT / SUM / AVG","GROUP BY / HAVING","INNER JOIN ⭐⭐⭐","LEFT JOIN ⭐⭐⭐","RIGHT JOIN","Multiple Joins","Subqueries","CASE WHEN / CTE / Window"]},
{ id:"3", title:"🟠 POWER BI", color:"#f97316", items:["Interface / Import Excel CSV","Tables / Fields / Charts","Filters / Slicers","Power Query Cleaning","Relationships / Data Model","Measures / DAX SUM COUNT","CALCULATE","KPI Dashboard","Interactive Dashboard / Publish"]},
{ id:"4", title:"✉️ COMMUNICATION", color:"#94a3b8", items:["Professional Email","Daily Report Mail","Status Update","Follow-up Mail","Data Request / Escalation","Basic English Comm","Explain Report to Boss"]},
{ id:"5", title:"⚪ PYTHON / PANDAS", color:"#a78bfa", items:["Python Basics","Pandas Series / DataFrame","Read Excel/CSV","Filtering / GroupBy","Merge/Join like VLOOKUP","Data Cleaning","Mini Project 10k rows"]}
];

let state = JSON.parse(localStorage.getItem('mis_tracker') || '{}');

function save(){ localStorage.setItem('mis_tracker', JSON.stringify(state)); updateProgress(); }

function updateProgress(){
let total=0,done=0;
data.forEach(l=>{
l.items.forEach((_,i)=>{
total++;
if(state[l.id+'_'+i]) done++;
});
});
let pct = total? Math.round(done/total*100):0;
document.getElementById('percent').innerText = pct+'%';
document.getElementById('overallText').innerText = pct+'% Mudichachu - '+done+'/'+total;
document.getElementById('circle').style.setProperty('--p', (pct*3.6)+'deg');
}

function render(){
const c=document.getElementById('container');
c.innerHTML='';
data.forEach(level=>{
const lvl=document.createElement('div');
lvl.className='level';
let doneCount = level.items.filter((_,i)=> state[level.id+'_'+i]).length;
lvl.innerHTML=`<div class="level-head" data-id="${level.id}"><span class="level-title">${level.title}</span><span class="level-badge" style="color:${level.color}">${doneCount}/${level.items.length}</span></div><div class="tasks" id="tasks-${level.id}"></div>`;
c.appendChild(lvl);
const tasksDiv=lvl.querySelector('.tasks');
level.items.forEach((it,i)=>{
const key=level.id+'_'+i;
const t=document.createElement('div');
t.className='task'+(state[key]?' done':'');
// FIX: use click with touch threshold logic
let touchStartY=0, touchStartX=0, touchStartTime=0;
t.addEventListener('touchstart', e=>{
 touchStartY=e.touches[0].clientY;
 touchStartX=e.touches[0].clientX;
 touchStartTime=Date.now();
},{passive:true});
t.addEventListener('touchend', e=>{
 let dy=Math.abs(e.changedTouches[0].clientY - touchStartY);
 let dx=Math.abs(e.changedTouches[0].clientX - touchStartX);
 let dt=Date.now() - touchStartTime;
 // Only toggle if small movement and quick tap = not scroll
 if(dy<10 && dx<10 && dt<300){
   state[key]=!state[key];
   t.classList.toggle('done');
   save();
   render(); // re-render to update counts
 }
},{passive:true});
// For mouse/desktop
t.addEventListener('click', e=>{
 // ignore click if it was already handled by touch
 if(e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
 // prevent double trigger on mobile
 if(Date.now() - touchStartTime < 500 && touchStartY!==0) return;
 state[key]=!state[key];
 t.classList.toggle('done');
 save();
 render();
});
t.innerHTML=`<div class="check">${state[key]?'✓':''}</div><div class="task-text">${it}</div>`;
tasksDiv.appendChild(t);
});
lvl.querySelector('.level-head').addEventListener('click', ()=>{
tasksDiv.classList.toggle('open');
});
});
updateProgress();
}
render();
</script>
</body>
</html>
